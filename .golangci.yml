version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  tests: true

linters:
  default: none

  enable:
    # Must-have
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - copyloopvar

    # Nice-to-have
    - gocritic
    - misspell
    - unconvert
    - unparam
    - wrapcheck
    - nakedret

issues:
  max-issues-per-linter: 0
  max-same-issues: 0